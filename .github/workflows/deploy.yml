name: Deploy Backend a K3s (EC2)

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: 'AWS Access Key ID (Temporal)'
        required: true
      aws_secret_access_key:
        description: 'AWS Secret Access Key (Temporal)'
        required: true
      aws_session_token:
        description: 'AWS Session Token (Temporal)'
        required: true
      ec2_host:
        description: 'IP o DNS de la instancia EC2 (K3s)'
        required: true
      ec2_ssh_key:
        description: 'Clave SSH privada (PEM) para conectar a EC2'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar dependencias (Prisma)
        run: npx prisma generate

      # NOTA DE RÚBRICA: Ejecución de tests que cubren al menos 3 operaciones CRUD
      - name: Ejecutar pruebas unitarias (Tests CRUD)
        run: npm run test

      - name: Log in al Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      - name: Build imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          load: true

      - name: Escaneo de Seguridad con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'table'
          exit-code: '0' 
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push imagen Docker a GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Preparar manifiestos K8s para despliegue
        run: |
          sed -i "s|<DOCKER_USER>/saludtotal-backend:latest|${{ steps.meta.outputs.tags }}|g" k8s/backend-deployment.yaml
      
      - name: Guardar manifiestos modificados como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: k8s-manifests
          path: k8s/

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar manifiestos
        uses: actions/download-artifact@v4
        with:
          name: k8s-manifests
          path: k8s/

      - name: Configurar Credenciales AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.event.inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ github.event.inputs.aws_secret_access_key }}
          aws-session-token: ${{ github.event.inputs.aws_session_token }}
          aws-region: us-east-1

      - name: Configurar SSH y desplegar en K3s (EC2)
        env:
          SSH_PRIVATE_KEY: ${{ github.event.inputs.ec2_ssh_key }}
          EC2_HOST: ${{ github.event.inputs.ec2_host }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Copiamos los manifiestos a la EC2
          scp -r k8s/ ubuntu@$EC2_HOST:~/k8s-deploy/
          
          # Ejecutamos kubectl dentro de la EC2 para aplicar la actualización
          ssh ubuntu@$EC2_HOST "sudo k3s kubectl apply -f ~/k8s-deploy/secrets.yaml && \
                                sudo k3s kubectl apply -f ~/k8s-deploy/backend-deployment.yaml && \
                                sudo k3s kubectl apply -f ~/k8s-deploy/hpa.yaml && \
                                sudo k3s kubectl rollout status deployment/saludtotal-backend"
