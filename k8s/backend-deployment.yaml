apiVersion: apps/v1
kind: Deployment
metadata:
  name: saludtotal-backend
  labels:
    app: saludtotal-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saludtotal-backend
  template:
    metadata:
      labels:
        app: saludtotal-backend
    spec:
      containers:
      - name: backend
        image: <DOCKER_USER>/saludtotal-backend:latest # Reemplazar con tu imagen
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: saludtotal-backend-service
spec:
  type: ClusterIP
  selector:
    app: saludtotal-backend
  ports:
  - port: 3000
    targetPort: 3000
